---
- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common system packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Enable QEMU Guest Agent service
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
